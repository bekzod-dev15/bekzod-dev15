<rect x="1" y="1" width="758" height="212" rx="18" fill="#0b1020" stroke="#27344d"/><text x="30" y="34" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">GITHUB TERMINALI</text><rect x="30" y="45" width="700" height="1" fill="#27344d"/><rect x="26" y="55" width="708" height="144" rx="14" fill="#0f172a" stroke="#27344d"/><text x="48" y="80" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">bekzod@dev: ~/mening-saytim</text><text x="48" y="103" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">$ git add .</text><text x="48" y="126" fill="#a78bfa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">$ git commit -m &quot;yangi sahifa&quot;</text><text x="48" y="149" fill="#34d399" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">$ git push origin main</text><text x="48" y="172" fill="#e6edf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">[OK] Sayt GitHub’ga yuklandi</text></svg>