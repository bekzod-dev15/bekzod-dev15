<svg xmlns="http://www.w3.org/2000/svg" width="760" height="160" viewBox="0 0 760 160" role="img" aria-label="Men haqimda">
<title>Men haqimda</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<rect x="1" y="1" width="758" height="158" rx="18" fill="#0b1020" stroke="#27344d"/><text x="30" y="34" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">MEN HAQIMDA</text><rect x="30" y="45" width="700" height="1" fill="#27344d"/><text x="32" y="83" fill="#e6edf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">G‘oyalarni ishlaydigan saytlarga aylantirishni o‘rganyapman</text><text x="32" y="116" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Men Bekzod. HTML, CSS va JavaScript’ni amaliy loyihalar orqali o‘rganyapman.</text><text x="32" y="140" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400">Maqsadim — chiroyli, qulay va ishlaydigan saytlar yaratish.</text><rect x="515" y="59" width="216" height="82" rx="14" fill="#0f172a" stroke="#27344d"/><text x="535" y="86" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">const bekzod = {</text><text x="535" y="109" fill="#a78bfa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400">  learns: &quot;JavaScript&quot;</text><text x="535" y="130" fill="#22d3ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400">};</text></svg>